<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Each risk traced through its factors to its evidence and sources" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgWhy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07302b"/>
      <stop offset="1" stop-color="#0a4f49"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="url(#bgWhy)"/>
  <text x="40" y="52" fill="#2fe0c0" font-family="Inter,'Segoe UI',sans-serif" font-size="15" font-weight="700" letter-spacing="3">TRACED TO EVIDENCE</text>

  <!-- connectors: risk -> factors -->
  <g stroke="#2fe0c0" stroke-width="1.6" opacity="0.65" fill="none">
    <path d="M360 128 C 300 170, 220 190, 165 224"/>
    <path d="M360 128 L 360 224"/>
    <path d="M360 128 C 420 170, 500 190, 555 224"/>
  </g>
  <!-- connectors: factors -> sources (many-to-many) -->
  <g stroke="#1f9d92" stroke-width="1.3" opacity="0.55" fill="none">
    <path d="M165 274 L 130 420"/>
    <path d="M165 274 C 210 340, 260 370, 300 420"/>
    <path d="M360 274 C 330 340, 315 370, 300 420"/>
    <path d="M360 274 C 400 340, 440 370, 470 420"/>
    <path d="M555 274 C 520 340, 500 370, 470 420"/>
    <path d="M555 274 L 628 420"/>
  </g>

  <!-- risk node -->
  <circle cx="360" cy="96" r="33" fill="#2fe0c0"/>
  <text x="360" y="101" text-anchor="middle" fill="#052320" font-family="Inter,'Segoe UI',sans-serif" font-size="17" font-weight="700">Risk</text>

  <!-- factor chips -->
  <g font-family="Inter,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#eafffb">
    <g>
      <rect x="90" y="226" width="150" height="48" rx="12" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.45"/>
      <text x="165" y="255" text-anchor="middle">Supplier stress</text>
    </g>
    <g>
      <rect x="285" y="226" width="150" height="48" rx="12" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.45"/>
      <text x="360" y="255" text-anchor="middle">Material supply</text>
    </g>
    <g>
      <rect x="480" y="226" width="150" height="48" rx="12" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.45"/>
      <text x="555" y="255" text-anchor="middle">Transport</text>
    </g>
  </g>

  <!-- source chips -->
  <g font-family="Inter,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#cfe4df">
    <g>
      <rect x="66" y="420" width="128" height="40" rx="20" fill="rgba(47,224,192,0.10)" stroke="#1f9d92"/>
      <text x="130" y="445" text-anchor="middle">ERP</text>
    </g>
    <g>
      <rect x="228" y="420" width="144" height="40" rx="20" fill="rgba(47,224,192,0.10)" stroke="#1f9d92"/>
      <text x="300" y="445" text-anchor="middle">Supplier portal</text>
    </g>
    <g>
      <rect x="404" y="420" width="132" height="40" rx="20" fill="rgba(47,224,192,0.10)" stroke="#1f9d92"/>
      <text x="470" y="445" text-anchor="middle">Market data</text>
    </g>
    <g>
      <rect x="560" y="420" width="140" height="40" rx="20" fill="rgba(47,224,192,0.10)" stroke="#1f9d92"/>
      <text x="630" y="445" text-anchor="middle">News &amp; weather</text>
    </g>
  </g>
</svg>
