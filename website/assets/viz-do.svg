<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Three prioritised mitigation actions, each with its expected effect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgDo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07302b"/>
      <stop offset="1" stop-color="#0a4f49"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="url(#bgDo)"/>
  <text x="40" y="52" fill="#2fe0c0" font-family="Inter,'Segoe UI',sans-serif" font-size="15" font-weight="700" letter-spacing="3">PRIORITISED ACTION</text>

  <!-- row template -->
  <g font-family="Inter,'Segoe UI',sans-serif">
    <!-- P1 -->
    <g>
      <rect x="40" y="96" width="640" height="104" rx="16" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.30"/>
      <circle cx="84" cy="148" r="20" fill="#2fe0c0"/>
      <text x="84" y="154" text-anchor="middle" fill="#052320" font-size="15" font-weight="700">P1</text>
      <text x="124" y="140" fill="#eafffb" font-size="18" font-weight="600">Activate secondary supplier</text>
      <text x="124" y="168" fill="#84ada6" font-size="13">Reduces single-source exposure on the critical line</text>
      <g>
        <rect x="498" y="126" width="158" height="44" rx="22" fill="rgba(84,192,139,0.14)" stroke="#54c08b"/>
        <text x="577" y="153" text-anchor="middle" fill="#9ff0c4" font-size="14" font-weight="700">+14% confidence</text>
      </g>
    </g>
    <!-- P2 -->
    <g>
      <rect x="40" y="212" width="640" height="104" rx="16" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.22"/>
      <circle cx="84" cy="264" r="20" fill="#24d8c0" opacity="0.85"/>
      <text x="84" y="270" text-anchor="middle" fill="#052320" font-size="15" font-weight="700">P2</text>
      <text x="124" y="256" fill="#eafffb" font-size="18" font-weight="600">Order steel four weeks earlier</text>
      <text x="124" y="284" fill="#84ada6" font-size="13">Buys schedule float before the price window closes</text>
      <g>
        <rect x="498" y="242" width="158" height="44" rx="22" fill="rgba(84,192,139,0.14)" stroke="#54c08b"/>
        <text x="577" y="269" text-anchor="middle" fill="#9ff0c4" font-size="14" font-weight="700">−11 days · −€2.3M</text>
      </g>
    </g>
    <!-- P3 -->
    <g>
      <rect x="40" y="328" width="640" height="104" rx="16" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.16"/>
      <circle cx="84" cy="380" r="20" fill="#1f9d92"/>
      <text x="84" y="386" text-anchor="middle" fill="#eafffb" font-size="15" font-weight="700">P3</text>
      <text x="124" y="372" fill="#eafffb" font-size="18" font-weight="600">Review customs &amp; tariff strategy</text>
      <text x="124" y="400" fill="#84ada6" font-size="13">Re-routes exposure ahead of the new duty schedule</text>
      <g>
        <rect x="486" y="358" width="170" height="44" rx="22" fill="rgba(231,184,77,0.14)" stroke="#e7b84d"/>
        <text x="571" y="385" text-anchor="middle" fill="#f1d58a" font-size="13" font-weight="700">Critical &#8594; Medium</text>
      </g>
    </g>
  </g>
</svg>
