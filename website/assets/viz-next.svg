<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="A forecast line rising into the future with a widening uncertainty band and a 90-day horizon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgNext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07302b"/>
      <stop offset="1" stop-color="#0a4f49"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0c0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2fe0c0" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="url(#bgNext)"/>
  <text x="40" y="52" fill="#2fe0c0" font-family="Inter,'Segoe UI',sans-serif" font-size="15" font-weight="700" letter-spacing="3">FORECAST &amp; UNCERTAINTY</text>

  <!-- gridlines -->
  <g stroke="#2fe0c0" stroke-opacity="0.10" stroke-width="1">
    <line x1="40" y1="430" x2="680" y2="430"/>
    <line x1="40" y1="340" x2="680" y2="340"/>
    <line x1="40" y1="250" x2="680" y2="250"/>
    <line x1="40" y1="160" x2="680" y2="160"/>
  </g>

  <!-- uncertainty cone (future) -->
  <path d="M430 300 C 520 268, 600 236, 680 150 L 680 300 C 600 300, 520 318, 430 320 Z" fill="url(#band)"/>

  <!-- past (solid) -->
  <path d="M40 400 C 130 392, 200 372, 260 352 C 330 330, 380 318, 430 310" fill="none" stroke="#2fe0c0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- future (dotted projection) -->
  <path d="M430 310 C 500 288, 580 258, 680 214" fill="none" stroke="#2fe0c0" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.9"/>

  <!-- TODAY marker -->
  <line x1="430" y1="120" x2="430" y2="440" stroke="#eafffb" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 5"/>
  <circle cx="430" cy="310" r="6" fill="#eafffb"/>
  <text x="430" y="462" text-anchor="middle" fill="#cfe4df" font-family="Inter,'Segoe UI',sans-serif" font-size="13" font-weight="600" letter-spacing="1">TODAY</text>

  <!-- labels -->
  <text x="40" y="462" fill="#84ada6" font-family="Inter,'Segoe UI',sans-serif" font-size="13">Past</text>
  <text x="680" y="462" text-anchor="end" fill="#84ada6" font-family="Inter,'Segoe UI',sans-serif" font-size="13">+90 days</text>

  <!-- confidence pill -->
  <g>
    <rect x="486" y="150" width="170" height="40" rx="20" fill="#0c2e29" stroke="#2fe0c0" stroke-opacity="0.45"/>
    <circle cx="512" cy="170" r="6" fill="#2fe0c0"/>
    <text x="528" y="175" fill="#eafffb" font-family="Inter,'Segoe UI',sans-serif" font-size="14" font-weight="600">82% confidence</text>
  </g>
</svg>
